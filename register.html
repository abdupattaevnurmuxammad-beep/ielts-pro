<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (localStorage.getItem("ielts-theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600&display=swap">
<title>Register — IELTS PRO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<div class="stars2"></div>

<header>
<h2>🌌 IELTS PRO</h2>
<nav>
<div class="nav-links">
<a href="index.html">Home</a>
</div>
<div class="nav-buttons">
<button id="theme-toggle" onclick="toggleTheme()">☀️</button>
</div>
</nav>
</header>

<section class="hero">
<h1>Create Your Account</h1>
</section>

<section class="card test-box">
<label>Name<br>
<input type="text" id="reg-name" class="answer-input" placeholder="Your name"></label>
<br><br>
<label>Email<br>
<input type="email" id="reg-email" class="answer-input" placeholder="you@example.com"></label>
<br><br>
<label>Password<br>
<input type="password" id="reg-password" class="answer-input" placeholder="At least 6 characters"></label>
<br><br>
<button onclick="registerUser()">Register</button>
<p id="auth-error" style="color: var(--danger); margin-top: 12px;"></p>
<p style="margin-top: 16px;">Already have an account? <a href="login.html">Login here</a></p>
</section>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="auth.js"></script>
<script src="theme.js"></script>

</body>
</html>
